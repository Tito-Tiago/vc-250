# === MoE (Mixture of Experts) ===
# Uso: cp /etc/llama-server/profiles/moe.conf /etc/conf.d/llama-server
# Ex: Gemma 4 26B-A3B Q3_K_M, Qwen3.5 35B-A3B
# NOTA: MoE via llama-server direto é ~2.4x mais rápido que via Ollama (b9265)

LLAMA_ARGS="--host 0.0.0.0 --port 8080 \
  --model /data/models/model.gguf \
  -ngl 99 \
  -fa \
  --ctx-size 24576 \
  --kv-cache-type q8_0 \
  --threads 6 \
  --prio 2 \
  --no-mmap"

# --no-mmap para MoE: evita duplicação de memória entre page cache e GTT em UMA

GGML_VK_FORCE_MAX_ALLOCATION_SIZE=2000000000