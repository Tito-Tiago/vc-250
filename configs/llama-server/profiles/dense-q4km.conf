# === Denso Q4_K_M (padrão) ===
# Uso: cp /etc/llama-server/profiles/dense-q4km.conf /etc/conf.d/llama-server
# ~8-9B parâmetros, Q4_K_M, melhor trade-off qualidade/velocidade na BC-250

LLAMA_ARGS="--host 0.0.0.0 --port 8080 \
  --model /data/models/model.gguf \
  -ngl 99 \
  -fa \
  --ctx-size 8192 \
  --kv-cache-type q8_0 \
  --threads 6 \
  --prio 2"

GGML_VK_FORCE_MAX_ALLOCATION_SIZE=2000000000