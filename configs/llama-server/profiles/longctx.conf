# === Contexto Longo ===
# Uso: cp /etc/llama-server/profiles/longctx.conf /etc/conf.d/llama-server
# Até 32k tokens, KV cache q4_0 para economizar GTT

LLAMA_ARGS="--host 0.0.0.0 --port 8080 \
  --model /data/models/model.gguf \
  -ngl 99 \
  -fa \
  --ctx-size 32768 \
  --kv-cache-type q4_0 \
  --threads 6 \
  --prio 2"

GGML_VK_FORCE_MAX_ALLOCATION_SIZE=2000000000