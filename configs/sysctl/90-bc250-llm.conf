# BC-250 LLM — sysctl tuning para UMA (GDDR6 compartilhada)
# /etc/sysctl.d/90-bc250-llm.conf

# === Memória ===
# Ajustar conforme modelo: ~14.5-15GB para GTT
# TTM pages_limit vai na cmdline do kernel, não aqui

# Reduzir swappiness — UMA não se beneficia de swap
vm.swappiness=10

# Limpar page cache para liberar RAM para GTT
vm.vfs_cache_pressure=50

# Dirty pages: menos escrita assíncrona (menos latência em inferência)
vm.dirty_ratio=15
vm.dirty_background_ratio=5
vm.dirty_expire_centisecs=1000
vm.dirty_writeback_centisecs=500

# THP: MADVISE é o sweet spot para llama.cpp (mmap usa huge pages se possível)
# Alternativa: always (mais rápido em UMA, mais RAM desperdiçada) ou never (estável)
vm.nr_hugepages=0

# === Rede (llama-server HTTP) ===
net.core.somaxconn=256
net.core.netdev_max_backlog=256
net.ipv4.tcp_max_syn_backlog=256
net.ipv4.tcp_fastopen=3

# === File handles (modelo GGUF pode abrir muitos FDs) ===
fs.file-max=65536
fs.nr_open=65536

# === CPU ===
# Latência de inferência: menos agressividade de scheduling
kernel.sched_min_granularity_ns=1000000
kernel.sched_wakeup_granularity_ns=1500000

# === Opcional: mitigations off é na cmdline ===
# Se não quiser cmdline: usar aqui via /proc/sys (não persiste)
# Mas o recomendado é kernel cmdline: mitigations=off